<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" role="img">
  <title>计算机入门讲义</title>
  <desc>竖版内容导览，展示 Markdown、Git、WSL 三个讲义主题。不是讲义截图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101728"/><stop offset="1" stop-color="#1c2441"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
  </defs>
  <rect x="1" y="1" width="358" height="498" rx="22" fill="url(#bg)" stroke="#43516b"/>
  <rect x="1" y="1" width="358" height="498" rx="22" fill="url(#grid)"/>
  <path d="M22 17H338" stroke="#bba7ff" stroke-width="3" stroke-linecap="round"/>
  <g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Inter, sans-serif">
    <text x="28" y="55" fill="#bba7ff" font-size="17" font-weight="700" letter-spacing="3">LEARN AND SHARE</text>
    <text x="27" y="120" fill="#f6f8ff" font-size="44" font-weight="800">计算机入门讲义</text>
    <text x="28" y="164" fill="#bfcae0" font-size="19">从常用工具开始，边做边学</text>
    <rect x="27" y="183" width="306" height="76" rx="16" fill="#16243c" stroke="#bba7ff" stroke-opacity=".42"/>
    <text x="180" y="216" text-anchor="middle" fill="#bba7ff" font-size="23" font-weight="700">Markdown</text>
    <text x="180" y="241" text-anchor="middle" fill="#bfcae0" font-size="16">排版与文档</text>
    <rect x="27" y="270" width="306" height="76" rx="16" fill="#16243c" stroke="#bba7ff" stroke-opacity=".42"/>
    <text x="180" y="303" text-anchor="middle" fill="#bba7ff" font-size="23" font-weight="700">Git</text>
    <text x="180" y="328" text-anchor="middle" fill="#bfcae0" font-size="16">版本管理与协作</text>
    <rect x="27" y="357" width="306" height="76" rx="16" fill="#16243c" stroke="#bba7ff" stroke-opacity=".42"/>
    <text x="180" y="390" text-anchor="middle" fill="#bba7ff" font-size="23" font-weight="700">WSL</text>
    <text x="180" y="415" text-anchor="middle" fill="#bfcae0" font-size="16">在 Windows 上使用 Linux</text>
    <text x="180" y="458" text-anchor="middle" fill="#bba7ff" font-size="30" font-weight="700">…</text>
    <text x="180" y="485" text-anchor="middle" fill="#bfcae0" font-size="15">打开仓库，阅读完整讲义</text>
  </g>
</svg>
