<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" role="img">
  <title>轨迹 · 铁路出行规划</title>
  <desc>竖版项目封面：路线节点依次为出发、途径、换乘、到达。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101728"/><stop offset="1" stop-color="#1c2441"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
  </defs>
  <rect x="1" y="1" width="358" height="498" rx="22" fill="url(#bg)" stroke="#43516b"/>
  <rect x="1" y="1" width="358" height="498" rx="22" fill="url(#grid)"/>
  <path d="M22 17H338" stroke="#59d4e7" stroke-width="3" stroke-linecap="round"/>
  <g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Inter, sans-serif">
    <text x="28" y="55" fill="#59d4e7" font-size="17" font-weight="700" letter-spacing="3">RAIL JOURNEY</text>
    <text x="27" y="120" fill="#f6f8ff" font-size="44" font-weight="800">轨迹</text>
    <text x="29" y="164" fill="#bfcae0" font-size="23">铁路出行规划</text>
    <rect x="28" y="184" width="110" height="32" rx="16" fill="#1d344a" stroke="#59d4e7" stroke-opacity=".35"/>
    <text x="83" y="206" text-anchor="middle" fill="#59d4e7" font-size="16" font-weight="700">Android</text>
    <rect x="22" y="234" width="316" height="223" rx="18" fill="#16243c" stroke="#43516b"/>
    <text x="180" y="263" text-anchor="middle" fill="#bfcae0" font-size="15" font-weight="700">路线示意</text>
    <path d="M100 286V428" stroke="#59d4e7" stroke-width="4" stroke-linecap="round"/>
    <circle cx="100" cy="292" r="10" fill="#16243c" stroke="#59d4e7" stroke-width="3"/>
    <circle cx="100" cy="292" r="3.5" fill="#59d4e7"/>
    <text x="145" y="299" fill="#f6f8ff" font-size="21" font-weight="700">出发</text>
    <circle cx="100" cy="336" r="10" fill="#16243c" stroke="#f2bc65" stroke-width="3"/>
    <circle cx="100" cy="336" r="3.5" fill="#f2bc65"/>
    <text x="145" y="343" fill="#f6f8ff" font-size="21" font-weight="700">途径</text>
    <circle cx="100" cy="380" r="10" fill="#16243c" stroke="#79d1aa" stroke-width="3"/>
    <circle cx="100" cy="380" r="3.5" fill="#79d1aa"/>
    <text x="145" y="387" fill="#f6f8ff" font-size="21" font-weight="700">换乘</text>
    <circle cx="100" cy="424" r="10" fill="#16243c" stroke="#f28c92" stroke-width="3"/>
    <circle cx="100" cy="424" r="3.5" fill="#f28c92"/>
    <text x="145" y="431" fill="#f6f8ff" font-size="21" font-weight="700">到达</text>
    <text x="180" y="481" text-anchor="middle" fill="#bfcae0" font-size="15">途径站 · 换乘筛选 · 离线规划</text>
