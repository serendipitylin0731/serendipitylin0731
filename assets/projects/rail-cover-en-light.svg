<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" role="img">
  <title>Trajectory · Railway Trip Planner</title>
  <desc>Vertical project cover showing departure, via station, transfer, and arrival.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f9fc"/><stop offset="1" stop-color="#eaf0fa"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#536480" stroke-opacity=".045"/></pattern>
  </defs>
  <rect x="1" y="1" width="358" height="498" rx="22" fill="url(#bg)" stroke="#cedae7"/>
  <rect x="1" y="1" width="358" height="498" rx="22" fill="url(#grid)"/>
  <path d="M22 17H338" stroke="#148da8" stroke-width="3" stroke-linecap="round"/>
  <g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Inter, sans-serif">
    <text x="28" y="55" fill="#148da8" font-size="17" font-weight="700" letter-spacing="3">RAIL JOURNEY</text>
    <text x="27" y="120" fill="#1d2b43" font-size="37" font-weight="800">Trajectory</text>
    <text x="29" y="164" fill="#52627b" font-size="20">Railway Trip Planner</text>
    <rect x="28" y="184" width="110" height="32" rx="16" fill="#e8f1f6" stroke="#148da8" stroke-opacity=".35"/>
    <text x="83" y="206" text-anchor="middle" fill="#148da8" font-size="16" font-weight="700">Android</text>
    <rect x="22" y="234" width="316" height="223" rx="18" fill="#ffffff" stroke="#cedae7"/>
    <text x="180" y="263" text-anchor="middle" fill="#52627b" font-size="15" font-weight="700">ROUTE OVERVIEW</text>
    <path d="M100 286V428" stroke="#148da8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="100" cy="292" r="10" fill="#ffffff" stroke="#148da8" stroke-width="3"/>
    <circle cx="100" cy="292" r="3.5" fill="#148da8"/>
    <text x="145" y="299" fill="#1d2b43" font-size="21" font-weight="700">Departure</text>
    <circle cx="100" cy="336" r="10" fill="#ffffff" stroke="#f2bc65" stroke-width="3"/>
    <circle cx="100" cy="336" r="3.5" fill="#f2bc65"/>
    <text x="145" y="343" fill="#1d2b43" font-size="21" font-weight="700">Via station</text>
    <circle cx="100" cy="380" r="10" fill="#ffffff" stroke="#79d1aa" stroke-width="3"/>
    <circle cx="100" cy="380" r="3.5" fill="#79d1aa"/>
    <text x="145" y="387" fill="#1d2b43" font-size="21" font-weight="700">Transfer</text>
    <circle cx="100" cy="424" r="10" fill="#ffffff" stroke="#f28c92" stroke-width="3"/>
    <circle cx="100" cy="424" r="3.5" fill="#f28c92"/>
    <text x="145" y="431" fill="#1d2b43" font-size="21" font-weight="700">Arrival</text>
    <text x="180" y="481" text-anchor="middle" fill="#52627b" font-size="12">Via stations · Transfers · Offline plans</text>
